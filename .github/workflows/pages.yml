# Publishes only the pitch deck (pitch/pitch-deck.html) to GitHub Pages,
# after the deck passes scripts/check-deck.py. Enable it once in
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Publish pitch deck

on:
  push:
    branches: [main]
    paths:
      - pitch/pitch-deck.html
      - pitch/pitch-deck.md
      - scripts/check-deck.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks (a)-(e) include the script and style hash pins and the tag and
      # attribute allowlists. Chrome is not at the macOS path on this runner,
      # so the render checks (f) and (g) report SKIP.
      - name: Check the deck
        run: python3 scripts/check-deck.py --html pitch/pitch-deck.html --markdown pitch/pitch-deck.md --expected-slides 14

      - name: Stage the deck
        run: |
          mkdir _site
          cp pitch/pitch-deck.html _site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
